<!DOCTYPE html>
<html>
<head>
    <title>GHL Gmail Extension Options</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            min-width: 300px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            cursor: pointer;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>GHL Gmail Extension Settings</h1>
    
    <label for="apiKey">GHL API Key (Bearer Token):</label>
    <input type="text" id="apiKey" name="apiKey">
    
    <button id="save">Save API Key</button>
    
    <div id="status"></div>

    <script src="options.js"></script>
</body>
</html>
